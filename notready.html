<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="icons/icontab3.ico"> <!--pageicon-->
  <title>Coming Soon - Beatriz Cintra</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .coming-soon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
      gap: 40px;
      margin-top: 54px;
    }

    .spinner {
      width: 120px;
      height: 120px;
      border: 4px solid rgba(255, 0, 64, 0.2);
      border-top: 4px solid #ff0040;
      border-right: 4px solid #ff3366;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      box-shadow: 0 0 20px rgba(255, 0, 64, 0.4);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .coming-soon-content h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 0;
      color: #ff0040;
      text-shadow: 0 0 10px #ff0040, 0 0 20px rgba(255, 0, 64, 0.5);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .coming-soon-content p {
      font-size: clamp(1rem, 3vw, 1.3rem);
      color: #ccc;
      margin: 20px 0;
      font-weight: 300;
      max-width: 600px;
    }

    .fun-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: rgba(255, 0, 64, 0.6);
      margin-top: 20px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }

    .status-badge {
      display: inline-block;
      padding: 12px 24px;
      border: 2px solid #ff0040;
      background: transparent;
      color: #ff0040;
      text-shadow: 0 0 5px #ff0040;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      margin-top: 30px;
    }

    .back-link {
      position: fixed;
      bottom: 40px;
      right: 40px;
      padding: 12px 24px;
      background: #ff0040;
      color: #000;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 0, 64, 0.3);
    }

    .back-link:hover {
      background: #ff3366;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 64, 0.6);
    }

    @media (max-width: 600px) {
      .coming-soon-container {
        margin-top: 80px;
        gap: 30px;
      }

      .spinner {
        width: 80px;
        height: 80px;
      }

      .back-link {
        bottom: 20px;
        right: 20px;
        padding: 10px 16px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar (same as index) -->
  <nav class="navbar">
    <div class="navbar-main">
      <a href="index.html" class="nav-home">Home</a>
      <div class="nav-links">
        <a href="getintouch.html" target="_blank">Work</a>
        <a href="getintouch.html" target="_blank">Get in Touch</a>
        <a href="cookie.html">Cookie</a>
        <a href="notready.html">Extra</a>
      </div>
      <button class="nav-toggle" onclick="toggleMenu()" title="Toggle Navigation Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Mobile menu -->
    <div class="navbar-mobile" id="mobileMenu">
      <a href="getintouch.html" target="_blank">Work</a>
      <a href="getintouch.html" target="_blank">Get in Touch</a>
      <a href="cookie.html">Cookie</a>
      <a href="notready.html">Extra</a>
    </div>
  </nav>

  <!-- Coming Soon Content -->
  <div class="coming-soon-container">
    <div class="spinner"></div>
    
    <div class="coming-soon-content">
      <h1>Not Ready Yet</h1>
      <p>This page is still being crafted with pixel-perfect precision</p>
      <p class="fun-text">// currently brewing something amazing ☕</p>
      
      <div class="status-badge">🔨 Under Construction</div>
    </div>

    <a href="index.html" class="back-link">← Back Home</a>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("open");
    }
  </script>

</body>
</html>
