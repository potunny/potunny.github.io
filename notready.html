<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="icons/icontab3.ico"> <!--pageicon-->
  <title>Under Construction - Beatriz Cintra</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-main">
      <a href="index.html" class="nav-home">Home</a>
      <div class="nav-links">
        <a href="work.html" data-i18n="nav_work">Work</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
        <a href="cookie.html">Cookie</a>
        <a href="shop.html" data-i18n="nav_shop">Shop</a>
      </div>
      <!-- Language Toggle -->
      <div class="lang-toggle" id="langToggle" onclick="toggleLanguage()">
      <div class="lang-slider" id="langSlider"></div>
      <span class="active">EN</span>
      <span>PT</span>
      </div>
      <!-- Mobile menu toggle -->
      <button class="nav-toggle" onclick="toggleMenu()" title="Toggle Navigation Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Mobile menu -->
    <div class="navbar-mobile" id="mobileMenu">
      <a href="work.html">Work</a>
      <a href="contact.html">Contact</a>
      <a href="cookie.html">Cookie</a>
      <a href="shop.html">Shop</a>
    </div>
  </nav>

  <!-- Under Construction Content -->
  <div class="coming-soon-container">
    <h1 style="font-size: clamp(2.5rem, 8vw, 4rem); color: #ff0040; text-shadow: 0 0 10px #ff0040; margin: 0; font-weight: 700;" data-i18n="under_construction">Under Construction</h1>
    <p style="font-size: clamp(1rem, 3vw, 1.3rem); color: #ccc; margin: 20px 0; max-width: 600px;" data-i18n="under_construction_subtitle">This page is currently being built. Check back soon!</p>
    <a href="index.html" class="shop-button" data-i18n="back_home">← Back Home</a>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("open");
    }

    // Close mobile menu when clicking outside
    document.addEventListener("click", function(event) {
      const menu = document.getElementById("mobileMenu");
      const toggleButton = document.querySelector(".nav-toggle");
      if (!toggleButton.contains(event.target) && !menu.contains(event.target)) {
        menu.classList.remove("open");
      }
    });

// Language translations
const translations = {
  en: {
    page_title: "Under Construction", // page title translation
    nav_work: "Work",
    nav_contact: "Contact",
    nav_shop: "Shop",
    under_construction: "Under Construction",
    under_construction_subtitle: "This page is currently being built. Check back soon!",
    back_home: "← Back Home",
  },
  pt: {
    page_title: "Em Construção", // page title translation
    nav_work: "Trabalho",
    nav_contact: "Contato",
    nav_shop: "Loja",
    under_construction: "Em Construção",
    under_construction_subtitle: "Esta página está em desenvolvimento. Volte mais tarde!",
    back_home: "← Voltar para a página inicial",
  }
};

let currentLang = 'en';

function applyLanguage(lang) {
      currentLang = lang;
      // update page title
      document.title = translations[currentLang].page_title;

      const slider = document.getElementById('langSlider');
      slider.style.transform = currentLang === 'pt' ? 'translateX(100%)' : 'translateX(0)';
      const spans = document.querySelectorAll('.lang-toggle span');
      spans.forEach(span => span.classList.remove('active'));
      spans[currentLang === 'en' ? 0 : 1].classList.add('active');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (translations[currentLang][key]) {
          el.textContent = translations[currentLang][key];
        }
      });
    }

    function toggleLanguage() {
      const nextLang = currentLang === 'en' ? 'pt' : 'en';
      localStorage.setItem('lang', nextLang);
      applyLanguage(nextLang);
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang) applyLanguage(savedLang);
  </script>

</body>
</html>
