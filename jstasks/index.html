    //last important detail: objects are references
    when we create a object like:
    const object1 = {
    message: 'hi'
    };
      the object1 does not contain hi inside, it contains a reference to the location of hi in the computer's memory
      the reason of that is to make the code mode efficient, so when we do:
      object2 = object1, it will point to that place instead of copying the entire object over and over again

      even when we are using const above, we can still reach the message inside and change it with object1.message = "h";

      if we create a object 3 = 'hi' and compare object 3 to 1 it will be false even if the message is the same because the reference is different
      but object2 will be true for the same as 1
    shortcuts for objects:
    const object1 = {message: 'hi'};
    //if we want to store message in a variable:
    const message = object1.message;
    //shortcut:
    const {message} = object1; //because the variable name is the same as the property name we can do this
    now we can do a console.log(message); and it will return hi

    const object1 = {message: 'hi', name: 'bob', age: 25};
