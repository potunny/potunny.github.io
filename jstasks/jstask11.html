  <button id="rockbtn" onclick="generaterock();">Rock</button>

    //1 is rock, 2 is paper and 3 is scissors

    function generaterock(){
      const randomi = Math.floor(Math.random() * 3) + 1;
      console.log(randomi);
      if (randomi === 1){
        score.ties = score.ties + 1;
        alert(`computer chose rock, tie!\nScore: ties ${score.ties}, losses ${score.losses}, wins ${score.wins}`)

        score.wins = score.wins + 1;
