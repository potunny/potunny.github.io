<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Rock, Paper, Scissors</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background-color: rgb(29, 29, 29);
      color: white;
    }
    button {
      font-size: 50px;
      padding: 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 10000px;
      background-color: rgb(29, 29, 29);
      border: 2px solid white;
    }

    #resetbtn{
      font-size: 20px;

<body>
  <h2>Rock, Paper, Scissors - Final Version</h2>
  <button id="rockbtn" onclick="generaterock();">✊</button>
  <button id="paperbtn" onclick="generatepaper();">✋</button>
  <button id="scissorsbtn" onclick="generatescissors()">✌️</button>
  <p id="resultp"></p>
  <p id="scorep"></p>
  <button id="resetbtn" onclick="resetscore()">Reset Score</button>

  <script>
    const rockbtn = document.getElementById("rockbtn");
    const paperbtn = document.getElementById("paperbtn");
    const scissorsbtn = document.getElementById("scissorsbtn");
    const resulEl = document.getElementById("resultp");
    const scoreEl = document.getElementById("scorep");
    let score = JSON.parse(localStorage.getItem('score'));

    if (score === null) {
      score = { wins: 0, losses: 0, ties: 0 };
    }
    else {
      scoreEl.innerHTML = `Score: Wins ${score.wins} | Losses ${score.losses} | Ties ${score.ties}`;
    }
    //1 is rock, 2 is paper and 3 is scissors

    function generaterock(){
      const randomi = Math.floor(Math.random() * 3) + 1;
      let messageResult = '';

      if (randomi === 1){
        score.ties = score.ties + 1;
        messageResult = 'You ✊ | ✊ Computer<br>Tie!'
      }
      else if (randomi === 2){
        score.losses = score.losses + 1;
        messageResult = 'You ✊ | ✋ Computer<br>You lose!'
      }
      else if (randomi === 3){
        score.wins = score.wins + 1;
        messageResult = 'You ✊ | ✌️ Computer<br>You win!'
      }
      resulEl.innerHTML = messageResult;
      scoreEl.innerHTML = `Score: Wins ${score.wins} | Losses ${score.losses} | Ties ${score.ties}`;

      localStorage.setItem('score', JSON.stringify(score));
    }

    function generatepaper(){
      const randomi = Math.floor(Math.random() * 3) + 1;
      let messageResult = '';

      if (randomi === 1){
        score.wins = score.wins + 1;
        messageResult = 'You ✋ | ✊ Computer<br>You win!'
      }
      else if (randomi === 2){
        score.ties = score.ties + 1;
        messageResult = 'You ✋ | ✋ Computer<br>Tie!'
      }
      else if (randomi === 3){
        score.losses = score.losses + 1;
        messageResult = 'You ✋ | ✌️ Computer<br>You lose!'
      }
      resulEl.innerHTML = messageResult; //tried before with textcontent instead of inner and only inner could break the line, \n didn't work
      scoreEl.innerHTML = `Score: Wins ${score.wins} | Losses ${score.losses} | Ties ${score.ties}`;

      localStorage.setItem('score', JSON.stringify(score));
    }

    function generatescissors(){
      const randomi = Math.floor(Math.random() * 3) + 1;
      let messageResult = '';

      if (randomi === 1){
        score.losses = score.losses + 1;
        messageResult = 'You ✌️ | ✊ Computer<br>You lose!'
      }
      else if (randomi === 2){
        score.wins = score.wins + 1;
        messageResult = 'You ✌️ | ✋ Computer<br>You win!'
      }
      else if (randomi === 3){
        score.ties = score.ties + 1;
        messageResult = 'You ✌️ | ✌️ Computer<br>Tie!'
    }
      resulEl.innerHTML = messageResult;
      scoreEl.innerHTML = `Score: Wins ${score.wins} | Losses ${score.losses} | Ties ${score.ties}`;

      localStorage.setItem('score', JSON.stringify(score));
    }

    function resetscore(){
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.removeItem('score');
      scoreEl.innerHTML = `Score: Wins ${score.wins} | Losses ${score.losses} | Ties ${score.ties}`;
      resulEl.innerHTML = '';
    }
