<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
<!-- tasks:
whenever you update the calculation, save it using .setItem()
when the page loads, use .getItem() to get the saved calculation and load it
use a default value of '' if nothing is saved
-->
  <style>
    button {
      width: 50px;
      height: 50px;
      font-size: 20px;
      background-color: rgb(145, 255, 154);
      margin: 3px;
    }
  </style>
</head>

<body>

  <main id="buttonmain"></main>

  <script>
    //load saved calculation or default to empty string
    let stringo = localStorage.getItem("calculation") || "";
    console.log("Loaded:", stringo);

    const buttons = [
      "1", "2", "3", "+",
      "4", "5", "6", "-",
      "7", "8", "9", "*",
      "0", ".", "=", "/",
      "C"                    //you just need to change here to add more buttons now
    ];

    const container = document.getElementById("buttonmain"); //gets that container

    buttons.forEach(value => { //value could be called banana here, it goes through each text in buttons
      const btn = document.createElement("button"); //and creates a button
      btn.textContent = value; //makes the button text the value in buttons

      if (value === "=") {
        btn.onclick = calculate;
      } 
      else if (value === "C") {
        btn.onclick = clearstring; 
      } 
      else {
        btn.onclick = () => addtostring(value); //just adds to the string calculation
      }

      container.appendChild(btn);//inserts the button into html(?)

      if (["+", "-", "*", "/"].includes(value)) { //if it's one of those symbols it adds a line break
        container.appendChild(document.createElement("br"));
      }
    }); //ends foreach loop

    function addtostring(v) {
      stringo += v;
      //save updated calculation:
      localStorage.setItem("calculation", stringo);
      console.log(stringo);
    }

    function calculate() {
      try { //try prevents errors from breaking the code like 2++2
        console.log(eval(stringo)); //eval makes the string become a js calculation
      } catch {
        console.log("Error"); //if error it just says error
      }
    }

    function clearstring() {
      stringo = "";
      //clear saved calculation:
      localStorage.setItem("calculation", "");
      console.log("Clear");
    }
  </script>

</body>
</html>
