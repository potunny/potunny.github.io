<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get In Touch - Beatriz Cintra</title>
  <link rel="icon" type="image/x-icon" href="icons/icontab3.ico"> <!--pageicon-->

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    html, body {
      min-height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }

    body {
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .contact-hero {
      margin-top: 64px;
      text-align: center;
      padding: 40px 12px 20px;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.5));
      border-bottom: 1px solid rgba(255, 0, 64, 0.3);
      color: #fff;
    }

    .contact-hero h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      color: #ff0040;
      text-shadow: 0 0 10px #ff0040;
      margin-bottom: 16px;
    }

    .contact-hero p {
      max-width: 740px;
      margin: 0 auto;
      font-size: 1.1rem;
      color: #ccc;
    }

    .contact-form-wrap {
      max-width: 600px;
      margin: 100px auto 40px;
      padding: 20px;
      background: rgba(17, 17, 17, 0.9);
      border: 1px solid rgba(255, 0, 64, 0.26);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(255, 0, 64, 0.18);
      backdrop-filter: blur(4px);
      overflow: visible;
    }

    .contact-form-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .contact-form-row label {
      color: #ff0040;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .contact-form-row input,
    .contact-form-row textarea {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 0, 64, 0.35);
      outline: 0;
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      transition: border 0.2s ease, box-shadow 0.2s ease;
      min-height: 42px;
    }

    .contact-form-row input:focus,
    .contact-form-row textarea:focus {
      border-color: #ff3366;
      box-shadow: 0 0 8px rgba(255, 0, 64, 0.4);
    }

    .contact-form-row textarea {
      min-height: 160px;
      resize: vertical;
    }

    .contact-submit {
      display: inline-block;
      margin-top: 4px;
      padding: 14px 28px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #000;
      background: #ff0040;
      border: 2px solid #ff0040;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      text-decoration: none;
    }

    .contact-submit:hover {
      background: #ff3366;
      box-shadow: 0 0 16px rgba(255, 0, 64, 0.5);
      transform: translateY(-2px);
    }

    .contact-feedback {
      margin-top: 16px;
      color: #8cffda;
      font-family: 'Share Tech Mono', monospace;
      text-align: center;
      min-height: 28px;
    }

    @media (max-width: 800px) {
      .contact-form-wrap {
        margin: 24px 16px 64px;
      }

      .contact-hero {
        padding: 54px 12px 28px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-main">
      <a href="index.html" class="nav-home">Home</a>
      <div class="nav-links">
        <a href="notready.html">Work</a>
        <a href="getintouch.html" class="active">Get in Touch</a>
        <a href="cookie.html">Cookie</a>
        <a href="notready.html">Extra</a>
      </div>
      <button class="nav-toggle" onclick="toggleMenu()" title="Toggle Navigation Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div class="navbar-mobile" id="mobileMenu">
      <a href="notready.html">Work</a>
      <a href="getintouch.html">Get in Touch</a>
      <a href="cookie.html">Cookie</a>
      <a href="notready.html">Extra</a>
    </div>
  </nav>

  <section class="contact-form-wrap">
    <div class="contact-form-intro" style="margin-bottom: 16px; text-align: center; color: #ccc; font-family: 'Share Tech Mono', monospace; font-size: 0.95rem;">
      <p>New idea? Bug report? Collaboration pitch? Write it out and hit send — I’ll get back to you in a flash.</p>
    </div>
    <form id="contactForm" action="https://formsubmit.co/154ed0ac7e067270d87a3cff42d65a28" method="POST" onsubmit="handleSubmit(event)">
      <input type="text" name="_honey" style="display:none" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_subject" value="New message from portfolio" />
      <input type="hidden" name="_template" value="table" />

      <div class="contact-form-row">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="contact-form-row">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="contact-form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required maxlength="1500"></textarea>
        <div id="messageCount" style="font-family:'Share Tech Mono', monospace; font-size:0.85rem; color:#ccc;">0 / 1500</div>
      </div>

      <button type="submit" class="contact-submit">Send Message</button>
      <div id="feedback" class="contact-feedback"></div>
    </form>
  </section>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('open');
    }

    function handleSubmit(event) {
      event.preventDefault();

      const form = event.target;
      if (form._honey.value) return;

      fetch(form.action, { method: form.method, body: new FormData(form) })
        .then(() => {
          form.reset();
          document.getElementById('messageCount').textContent = '0 / 1500';
          document.getElementById('feedback').textContent = 'Message sent! I’ll respond soon. 💌';
        })
        .catch(() => {
          document.getElementById('feedback').textContent = 'Oops, submission failed. Please try again.';
        });
    }

    const msgField = document.getElementById('message');
    const countEl = document.getElementById('messageCount');
    msgField.addEventListener('input', () => {
      countEl.textContent = `${msgField.value.length} / 1500`;
    });
  </script>
</body>
</html>
