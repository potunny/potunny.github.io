<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="icons/icontab3.ico"> <!--pageicon-->
  <title>Coming Soon - Beatriz Cintra</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar (same as index) -->
  <nav class="navbar">
    <div class="navbar-main">
      <a href="index.html" class="nav-home">Home</a>
      <div class="nav-links">
        <a href="work.html">Work</a>
        <a href="contact.html">Contact</a>
        <a href="cookie.html">Cookie</a>
        <a href="shop.html" class="active">Shop</a>
      </div>
      <button class="nav-toggle" onclick="toggleMenu()" title="Toggle Navigation Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Mobile menu -->
    <div class="navbar-mobile" id="mobileMenu">
      <a href="work.html">Work</a>
      <a href="contact.html">Contact</a>
      <a href="cookie.html">Cookie</a>
      <a href="shop.html" class="active">Shop</a>
    </div>
  </nav>

  <!-- Shop Redirect -->
  <div class="coming-soon-container">
    <a href="notready.html" target="_blank" class="shop-button">Visit The Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("open");
    }

    // Close mobile menu when clicking outside
    document.addEventListener("click", function(event) {
      const menu = document.getElementById("mobileMenu");
      const toggleButton = document.querySelector(".nav-toggle");
      if (!toggleButton.contains(event.target) && !menu.contains(event.target)) {
        menu.classList.remove("open");
      }
    });

  </script>

</body>
</html>
